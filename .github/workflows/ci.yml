name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check documentation links and training task structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import unquote

          root = Path.cwd()
          sources = [Path("README.md"), Path("AGENTS.md"), Path("standalone/README.md"), Path(".github/pull_request_template.md")]
          sources += list(Path("curriculum").rglob("*.md")) + list(Path("ai-harness").rglob("*.md"))
          errors = []
          for source in sources:
              if not source.is_file():
                  errors.append(f"Missing documentation: {source}")
                  continue
              content = source.read_text()
              for target in re.findall(r"\]\(([^)]+)\)", content):
                  if re.match(r"[a-zA-Z][a-zA-Z0-9+.-]*:", target) or target.startswith("#"):
                      continue
                  path, _, fragment = unquote(target).partition("#")
                  destination = source.parent / path
                  if not destination.exists():
                      errors.append(f"{source}: broken link to {target}")
                  elif fragment and destination.suffix == ".md":
                      anchors = set()
                      for heading in re.findall(r"^#{1,6} (.+)$", destination.read_text(), re.MULTILINE):
                          anchor = re.sub(r"[^\w\s-]", "", heading.lower()).replace(" ", "-")
                          anchors.add(anchor)
                      if fragment not in anchors:
                          errors.append(f"{source}: missing heading in {target}")

          tasks = sorted(Path("curriculum/tasks").glob("*.md"))
          numbers = [task.name.split("-", 1)[0] for task in tasks]
          if numbers != [f"{number:02d}" for number in range(1, 13)]:
              errors.append("Expected exactly Tasks 01-12, with no duplicate or missing numbers")
          index = Path("curriculum/README.md").read_text()
          sections = ["## Starting point", "## Brief", "## Path A", "## Path B", "## Path C", "## Done when", "## Debrief"]
          for task in tasks:
              content = task.read_text()
              if not content.startswith(f"# Task {task.name[:2]} "):
                  errors.append(f"{task}: title does not match its task number")
              if f"tasks/{task.name}" not in index:
                  errors.append(f"{task}: not linked from the task index")
              for section in sections:
                  if section not in content:
                      errors.append(f"{task}: missing {section}")

          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Documentation checks passed: {len(sources)} files, 12 task pages, local links and headings.")
          PY

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"

      - name: Install dependencies for the Linux runner
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"

      - name: Install dependencies for the Linux runner
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"

      - name: Install dependencies for the Linux runner
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

      - name: Test Learning Agent tools
        run: |
          ruby learning-agent/test/install_test.rb
          ruby learning-agent/test/publish_learning_summary_test.rb
